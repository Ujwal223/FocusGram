name: Bug Report
description: Report a crash, unexpected behavior, or broken feature in FocusGram
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form with specific details so the issue can be reproduced and resolved efficiently. Make sure you are using the latest release of FocusGram before opening a report.
  - type: input
    id: app_version
    attributes:
      label: FocusGram Version
      description: Found in Settings -> About FocusGram (e.g., v3.0.0)
      placeholder: "v3.0.0"
    validations:
      required: true
  - type: input
    id: device_info
    attributes:
      label: Device and Android Version
      description: Device manufacturer, model, and Android OS version
      placeholder: "e.g., Google Pixel 7, Android 14"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Content Blocker / Ads
        - Focus Gates (Breath, Friction, Cooldown)
        - Daily Limits & Session Timers
        - Direct Messages & Notifications
        - Chat Lock & App Lock
        - Media Downloader & Ghost Mode
        - Settings & General Navigation
        - Other / Not Sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and detailed description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Open FocusGram
        2. Navigate to ...
        3. Trigger ...
        4. See error or unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Observed Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Relevant Logcat Snippets or Screenshots
      description: Optional. Please ensure any attached text or images do not contain personal names, account IDs, or private message content.
    validations:
      required: false
  - type: checkboxes
    id: mandatory_checks
    attributes:
      label: Mandatory Confirmations
      options:
        - label: I am a human, I know what I am creating this issue for, and I am not filing this issue blindly based on an AI agent.
          required: true
        - label: I am sure the language of my Instagram account is set to English and nothing else.
          required: true
        - label: I confirm this report does NOT contain any passwords, tokens, session cookies, or personal DM text.
          required: true
        - label: I searched open and closed issues and verified this is not a duplicate.
          required: true
